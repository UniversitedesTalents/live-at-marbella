<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Live at Marbella</title><link rel="stylesheet" href="styles.css?v=8"><style>body{background:var(--paper);color:var(--navy);--line:#d5cbc6}main{max-width:800px;margin:25px auto;padding:20px}h1{font-size:48px}h2{font-size:28px}fieldset{border:1px solid var(--line);padding:22px;margin:24px 0}legend{font-weight:700}label{display:block;font-size:12px;font-weight:700;margin:12px 0}input,textarea,select{width:100%;display:block;margin-top:5px;padding:11px;border:1px solid #a7a1a0;background:#fff;color:var(--navy);border-radius:0}textarea{min-height:100px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.save{position:sticky;bottom:0;background:var(--paper);padding:16px 0;border-top:1px solid var(--line)}.save button{background:var(--navy);color:white;border:0;padding:14px 20px;font-weight:700}.help{font-size:13px;line-height:1.8}#status{font-size:12px;color:#28553c}@media(max-width:500px){main{padding:16px;margin:0}.row{grid-template-columns:1fr}fieldset{padding:16px}}</style><script defer src="events-data.js"></script><script defer src="editor.js"></script></head><body><main><a class="back" href="index.html">← View website</a><h1>Edit your <em>moments.</em></h1><p class="help">Change the fields below, then download the updated <strong>events-data.js</strong>. Replace that file in GitHub and commit to update the published website. These edits stay in this page until you download; they do not change the live site automatically.</p><form id="editor"><div id="fields"></div><div class="save"><button type="submit">Download updated events-data.js</button><p id="status" role="status"></p></div></form></main></body></html>
